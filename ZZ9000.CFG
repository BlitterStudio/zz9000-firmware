# ZZ9000.CFG — ZZ9000 firmware configuration file
#
# Place next to BOOT.bin in the SD card root (FAT32). Read once at
# cold boot; power-cycle after editing (soft resets skip it). # or ;
# start comments; options are case-insensitive; invalid entries are
# skipped, never fatal. Saving from ZZTop (or the firmware audio
# Save) rewrites the file; comments are dropped.

# videocap_profile: native-video output policy as one unit (resolution,
# capture width, refresh). Default filtered_60.
#   full_60             - 1280x1024 60Hz, full SuperHires detail
#   full_exact          - 1280x1024, match detected PAL/NTSC refresh
#   filtered_60         - 800x600 at standard 60Hz (default)
#   filtered_pal        - filtered 720x576 standard 50Hz
#   filtered_pal_exact  - filtered output matched to a PAL clock
#   filtered_ntsc_exact - filtered output matched to an NTSC clock
#   centered_1080p_60   - 1280x1024 centered in 1920x1080
# centered_1080p_60 needs a matching stack (older: full_60).
#videocap_profile = filtered_60

# videocap_sample: 28 MHz capture reduction: average (default), even,
# odd.
#videocap_sample = average

# videocap_crop_h / _v: capture origin, 28 MHz samples / lines
# (0..4095); commented = Automatic.
#videocap_crop_h = 279
#videocap_crop_v = 40

# Scanlines (scanlines-v2 bitstreams, firmware >= 2.0):
# mode 0=off (default) 1=alternate black 2=dimmed 3=soft gradient;
# parity picks the line of the pair (0/1).
#scanline_mode = 2
#scanline_parity = 0

# int2: drivers use INT2 instead of INT6 (replaces ENV:ZZ9K_INT2).
#int2 = on

# offscreen_bitmaps: P96 off-screen bitmaps in card VRAM, Z3 only.
#offscreen_bitmaps = on

# video_overlay: P96 picture-in-picture window (p96PIP), Z3 only.
#video_overlay = on

# mac: ethernet MAC override (replaces ENV:ZZ9K_MAC).
#mac = 68:82:F2:12:34:56

# hdf: boot hard-disk image in the card root (default zz9000.hdf).
#hdf = zz9000.hdf

# Audio control plane (ZZ9000AX). audio_active: scene slot (0..7)
# applied at boot and after every warm reset. audio_baseline: operator
# Paula/AX balance packed paula*256+ax (legs 0..255, 127 = 0 dB).
# Per scene N (eight keys): lpf = cutoff Hz 1..23900; eqXY = EQ band
# pair packed bandX*128+bandY (bands 0..100, 50 = 0 dB); out =
# prefactor*128+volume (0..100 each); pan = 0 left .. 50 center ..
# 100 right. Absent keys keep firmware defaults; values are plain
# decimals (no hex or separators).
