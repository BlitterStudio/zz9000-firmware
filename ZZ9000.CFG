# ZZ9000.CFG — ZZ9000 firmware configuration file
#
# Place this file next to BOOT.bin in the root of the SD card (FAT32).
# It is read once at cold boot (power-on) and settings apply
# immediately — no Amiga driver or ENV: variable needed. An Amiga
# soft reset does NOT re-read the file; power-cycle after editing.
#
# Lines starting with # or ; are comments. All options are optional;
# a missing option keeps the firmware's built-in default. Keys and
# values are case-insensitive.
#
# The options marked "replaces ENV:..." are also consulted by the
# Amiga drivers (firmware 2.3+ drivers). If the old ENV: variable
# still exists, it takes precedence over this file - remove the ENV
# variable when migrating. ZZTop 2.3+ edits this file in place
# (Project menu -> Settings).

# ---------------------------------------------------------------------
# videocap_mode: HDMI output mode used for Amiga native (chipset) video
#   800x600  - scale to 800x600 60Hz (default; most monitor-compatible)
#   pal      - native 720x576 50Hz (alias: 720x576)
# Replaces ENV:ZZ9000-VCAP-800x600.
# ---------------------------------------------------------------------
#videocap_mode = pal

# ---------------------------------------------------------------------
# nonstandard_vsync: match the exact Amiga chipset refresh rate for
# scandoubled native video, so PAL/NTSC scrolling is stutter-free on
# displays that accept the slightly off-spec timing.
#   off   - standard 50/60 Hz timings (default)
#   pal   - ~49.92 Hz (PAL Amiga; alias: on)
#   ntsc  - NTSC Amiga variant
# Replaces ENV:ZZ9000-NS-VSYNC / ENV:ZZ9000-NS-VSYNC-NTSC and the
# separate "ns-pal" firmware download (use: videocap_mode = pal plus
# nonstandard_vsync = pal).
# ---------------------------------------------------------------------
#nonstandard_vsync = pal

# ---------------------------------------------------------------------
# Scanline overlay for scandoubled native video (needs a bitstream
# with scanlines-v2 support, firmware >= 2.0):
#   scanline_mode:   0 = off (default)
#                    1 = every other line black
#                    2 = every other line dimmed to 62.5%
#                    3 = soft gradient over 4 lines (100/75/50/75)
#   scanline_parity: 0 or 1 - which line of the pair is dimmed
# Same settings as the ZZTop / ZZScanlines tools, applied from boot.
# ---------------------------------------------------------------------
#scanline_mode = 2
#scanline_parity = 0

# ---------------------------------------------------------------------
# int2: tell the Amiga drivers to use interrupt INT2 instead of INT6.
#   off (default) | on
# Replaces ENV:ZZ9K_INT2 (drivers query this value from the firmware).
# ---------------------------------------------------------------------
#int2 = on

# ---------------------------------------------------------------------
# offscreen_bitmaps: let P96 place off-screen bitmaps (window backing
# store, double buffers) in card VRAM so blits between them and the
# screen run on the card instead of the CPU. Zorro 3 only.
#   on (default) | off
# The drivers query this value; ENV:ZZ9000-NO-OFFSCREEN and the
# ZZ9000.card OFFSCREENBITMAPS tooltype take precedence over it.
# ---------------------------------------------------------------------
#offscreen_bitmaps = on

# ---------------------------------------------------------------------
# mac: override the ethernet MAC address (replaces ENV:ZZ9K_MAC).
# ---------------------------------------------------------------------
#mac = 68:82:F2:12:34:56

# ---------------------------------------------------------------------
# hdf: name of the hard-disk image (in the root of this SD card)
# exposed to the Amiga by the zzsd.device autoboot driver.
# Default: zz9000.hdf
# ---------------------------------------------------------------------
#hdf = zz9000.hdf
