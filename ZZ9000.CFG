# ZZ9000.CFG: SD root beside BOOT.bin; power-cycle after editing.
# Case-insensitive keys; #/; comments; invalid values ignored.
# Saves regenerate supported keys and discard comments.

# Profile: default filtered_60; centered needs matched stack.
#   full_60             - 1280x1024, 60Hz, full detail
#   full_exact          - 1280x1024, match PAL/NTSC
#   filtered_60         - PAL 800x600 / NTSC 720x480, 60Hz
#   filtered_pal        - PAL 720x576 50Hz / NTSC 720x480 60Hz
#   filtered_pal_exact  - filtered, PAL-clock timing
#   filtered_ntsc_exact - filtered, NTSC-clock timing
#   centered_1080p_60   - 1080p 60.03Hz, centered 1280x1024
#   centered_1080p_50   - 1080p 50.02Hz, centered 1280x1024
#
# Experimental matched stack:
#   centered_1080p_match - 1080p centered, refresh locked to the Amiga
#videocap_profile = filtered_60

# 28 MHz reduction: average (default), even, odd.
#videocap_sample = average
# Phase: 0/unset = routed default. Clock-specific; never interchangeable.
# Legacy E7M: -255..255, 448 steps/turn. Ignored by C28 builds.
#videocap_phase = 0
# Opt-in C28: -896..895, 1792 steps/turn. Ignored by legacy builds.
#videocap_c28_phase = 0

# Crop: 0..4095 samples / lines; commented = Automatic.
#videocap_crop_h = 279
#videocap_crop_v = 40

# Scanlines-v2: 0=off, 1=black, 2=dimmed, 3=gradient; parity 0/1.
#scanline_mode = 2
#scanline_parity = 0

# int2: INT2 instead of INT6.
#int2 = on

# P96 off-screen bitmaps, Z3 only.
#offscreen_bitmaps = on

# P96 video overlay, Z3 only.
#video_overlay = on

# Ethernet MAC override.
#mac = 68:82:F2:12:34:56

# Boot HDF in SD root; default zz9000.hdf.
#hdf = zz9000.hdf

# ZZ9000AX audio: active 0..7; baseline = paula*256+ax (0..255).
# Fallback ceilings Paula 48 / AX 80 come from one measured R1 card:
# they are conservative candidates, not a clean guarantee on every
# board. Boot mixer and no-saved-baseline Balance start at 36/72
# (weighted Level 132/160). Saved ceilings and baseline always win;
# an older saved 256/256 or 192/255 pair will NOT be changed by this
# fallback. Measure your card before increasing either ceiling.
# Scene pairs use hi*128+lo; EQ/out/pan 0..100; LPF 1..23900.
# nm1..nm8 pack two ASCII chars as c1*256+c2; 0 ends a name.
#audio_active = 0
#audio_baseline = 9288
#audio_ceiling_paula = 48
#audio_ceiling_ax = 80
