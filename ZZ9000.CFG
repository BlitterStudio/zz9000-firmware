# ZZ9000.CFG — ZZ9000 firmware configuration file
#
# Place this file next to BOOT.bin in the root of the SD card (FAT32).
# It is read once at cold boot (power-on) and settings apply
# immediately — no Amiga driver or ENV: variable needed. An Amiga
# soft reset does NOT re-read the file; power-cycle after editing.
#
# Lines starting with # or ; are comments. All options are optional;
# a missing option keeps the firmware's built-in default. Keys and
# values are case-insensitive.
#
# The options marked "replaces ENV:..." are also consulted by the
# Amiga drivers (firmware 2.3+ drivers). If the old ENV: variable
# still exists, it takes precedence over this file - remove the ENV
# variable when migrating. ZZTop 2.7+ edits every current key in place
# (Project menu -> Settings).

# ---------------------------------------------------------------------
# videocap_profile: complete Amiga native-video output policy.
# Pick one profile; resolution, capture width and refresh are changed as a
# unit, so no setting silently overrides another. The built-in default is
# full_60.
#   full_60             - 1280x1024 60Hz, full SuperHires detail (default)
#   full_exact          - 1280x1024, match the detected PAL/NTSC refresh
#   filtered_60         - compatible filtered output at standard 60Hz
#   filtered_pal        - filtered 720x576 standard 50Hz
#   filtered_pal_exact  - filtered output matched to a PAL Amiga clock
#   filtered_ntsc_exact - filtered output matched to an NTSC Amiga clock
#   centered_1080p_60   - 1280x1024 content centered in 1920x1080
#
# centered_1080p_60 places the content at (320,28), leaving black borders.
# It uses the existing 150 MHz timing, so its nominal 60Hz output is actually
# about 60.60606Hz. It requires matching full-rate viewport-capable bitstream,
# firmware and current drivers/ZZTop; old or mixed installations fall back to
# full_60 and do not preserve the centered selection. full_60 stays the default.
# ---------------------------------------------------------------------
#videocap_profile = full_60

# ---------------------------------------------------------------------
# videocap_sample: how the 28 MHz capture is reduced to output pixels.
# average (default) box-filters each sample pair, which is a no-op for
# lores/hires (both samples are the same Amiga pixel) and a 2-tap filter
# for SuperHires. even/odd store one sample of the pair instead and exist
# to verify the capture clock phase against older bitstreams.
# ---------------------------------------------------------------------
#videocap_sample = average

# ---------------------------------------------------------------------
# videocap_crop_h / videocap_crop_v: captured-window origin, measured in
# 28 MHz samples and lines. Increasing crop_h moves the picture left;
# increasing crop_v moves it up. Leave an axis commented for Automatic:
# full-rate + full-width uses 280/40, while filtered and Denise-adapter paths
# use the historical 188/26. Uncommenting a value is an exact Custom override.
# The axes may be overridden independently. Range: 0..4095.
# ---------------------------------------------------------------------
#videocap_crop_h = 280
#videocap_crop_v = 40

# ---------------------------------------------------------------------
# Scanline overlay for scandoubled native video (needs a bitstream
# with scanlines-v2 support, firmware >= 2.0):
#   scanline_mode:   0 = off (default)
#                    1 = every other line black
#                    2 = every other line dimmed to 62.5%
#                    3 = soft gradient over 4 lines (100/75/50/75)
#   scanline_parity: 0 or 1 - which line of the pair is dimmed
# Same settings as the ZZTop / ZZScanlines tools, applied from boot.
# ---------------------------------------------------------------------
#scanline_mode = 2
#scanline_parity = 0

# ---------------------------------------------------------------------
# int2: tell the Amiga drivers to use interrupt INT2 instead of INT6.
#   off (default) | on
# Replaces ENV:ZZ9K_INT2 (drivers query this value from the firmware).
# ---------------------------------------------------------------------
#int2 = on

# ---------------------------------------------------------------------
# offscreen_bitmaps: let P96 place off-screen bitmaps (window backing
# store, double buffers) in card VRAM so blits between them and the
# screen run on the card instead of the CPU. Zorro 3 only.
#   on (default) | off
# The drivers query this value; ENV:ZZ9000-NO-OFFSCREEN and the
# ZZ9000.card OFFSCREENBITMAPS tooltype take precedence over it.
# ---------------------------------------------------------------------
#offscreen_bitmaps = on

# ---------------------------------------------------------------------
# video_overlay: P96 picture-in-picture video window (used by video
# players via p96PIP): the card composites a scaled YUV overlay into
# the display. Zorro 3 only.
#   on (default) | off
# The drivers query this value; ENV:ZZ9000-NO-PIP and the ZZ9000.card
# VIDEOPIP tooltype take precedence over it.
# ---------------------------------------------------------------------
#video_overlay = on

# ---------------------------------------------------------------------
# mac: override the ethernet MAC address (replaces ENV:ZZ9K_MAC).
# ---------------------------------------------------------------------
#mac = 68:82:F2:12:34:56

# ---------------------------------------------------------------------
# hdf: name of the hard-disk image (in the root of this SD card)
# exposed to the Amiga by the zzsd.device autoboot driver.
# Default: zz9000.hdf
# ---------------------------------------------------------------------
#hdf = zz9000.hdf
