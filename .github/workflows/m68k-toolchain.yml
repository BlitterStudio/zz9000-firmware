# Follow the GCC 16 m68k compiler image. The tag below moves with every GCC 16
# release candidate; the SDK builds pin it by digest
# (sdk/scripts/m68k-toolchain-pin.sh). When the tag points at a new image,
# this job moves every pin on the build/m68k-toolchain branch and opens or
# updates a pull request for it; the Build firmware workflow then builds,
# packages and smoke-tests the SDK with the new image on that pull request.
# Merging it is the decision; card runs of the current compiler happen before
# releases.
name: m68k toolchain update

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      image:
        description: image tag to follow for this run (empty = TOOLCHAIN_IMAGE below)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: m68k-toolchain-update

env:
  # The image tag to follow. amigadev/crosstools renames it to
  # m68k-amigaos-16 when GCC 16 leaves release candidates: change it here
  # then, and the next run moves every pin to the new tag. A manual run can
  # try another tag first (input `image`).
  TOOLCHAIN_IMAGE: ${{ inputs.image || 'amigadev/crosstools:m68k-amigaos-gcc10' }}
  BRANCH: build/m68k-toolchain

jobs:
  update:
    name: Follow the m68k compiler image
    runs-on: ubuntu-latest
    steps:
      # The bump is pushed and proposed as the ZZ9000 toolchain GitHub App,
      # not with the workflow token: GitHub starts no workflows for workflow-
      # token pushes and holds CI on pull requests opened by github-actions
      # for manual approval. With the App token the branch and the pull
      # request get their normal CI.
      - name: App token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          # app-id: actionlint does not know v3's client-id input yet.
          app-id: ${{ vars.M68K_TOOLCHAIN_APP_ID }}
          private-key: ${{ secrets.M68K_TOOLCHAIN_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.token.outputs.token }}
      - name: Compare the pin with the tag
        id: pin
        run: |
          set -euo pipefail
          old=$(sdk/scripts/m68k-toolchain-pin.sh current)
          digest=$(docker buildx imagetools inspect "$TOOLCHAIN_IMAGE" | awk '/^Digest:/ { print $2; exit }')
          new="$TOOLCHAIN_IMAGE@$digest"
          echo "pinned: $old"
          echo "tag:    $new"
          if [ "$old" = "$new" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          old_version=$(docker run --rm "$old" m68k-amigaos-gcc --version | head -n 1)
          new_version=$(docker run --rm "$new" m68k-amigaos-gcc --version | head -n 1)
          {
            echo "changed=true"
            echo "old=$old"
            echo "new=$new"
            echo "old_version=$old_version"
            echo "new_version=$new_version"
          } >> "$GITHUB_OUTPUT"
      - name: Push the bump and open or update its pull request
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          OLD: ${{ steps.pin.outputs.old }}
          NEW: ${{ steps.pin.outputs.new }}
          OLD_VERSION: ${{ steps.pin.outputs.old_version }}
          NEW_VERSION: ${{ steps.pin.outputs.new_version }}
        run: |
          set -euo pipefail
          sdk/scripts/m68k-toolchain-pin.sh set "$NEW"
          bot_id=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$bot_id+${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -u
          git commit -q -m "build: m68k toolchain $NEW_VERSION" \
            -m "Pin $NEW (was $OLD_VERSION, $OLD)."
          git push -f origin "$BRANCH"
          title="m68k toolchain: $NEW_VERSION"
          body=$(printf '%s\n' \
            "The \`$TOOLCHAIN_IMAGE\` tag points at a new image." \
            "" \
            "| | Compiler | Image |" \
            "|---|---|---|" \
            "| pinned | $OLD_VERSION | \`$OLD\` |" \
            "| new | $NEW_VERSION | \`$NEW\` |" \
            "" \
            "Merging moves the SDK builds to this compiler. The drivers repo follows its own pin, and its SDK payloads follow \`sdk/SDK_REF\`. A card run of the current compiler is due before the next release.")
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body "$body"
          else
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
              --title "$title" --body "$body"
          fi
