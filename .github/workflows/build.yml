name: Build firmware

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR. Never cancel tag builds —
# those feed the release job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    name: lint (actionlint + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: actionlint (workflow files)
        run: docker run --rm -v "$PWD":/repo:ro -w /repo rhysd/actionlint:latest -color
      - name: shellcheck (shell scripts, errors only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          files=$(git ls-files '*.sh')
          if [ -n "$files" ]; then
            echo "$files" | xargs shellcheck --severity=error
          fi

  host-tests:
    name: Host regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: RTG regression suite
        run: make -C test/rtg test
      - name: Video pipeline regression suite
        run: make -C test/video test
      - name: Firmware-file restore suite
        run: make -C test/fwupdate test
      - name: SD activity LED suite
        run: make -C test/sd_activity_led test
      - name: Scheduler host tests
        run: make -C test/scheduler test
      - name: ZZ9000.CFG parser suite
        run: make -C test/config test
      - name: Surface allocator suite
        run: make -C test/allocator test

  build:
    name: Build & package firmware
    runs-on: ubuntu-latest
    env:
      ARM_TOOLCHAIN_VERSION: 13.2.rel1
      ARM_TOOLCHAIN_DIR: ${{ github.workspace }}/.toolchain/arm-gnu-toolchain
      BOOTGEN_REF: master

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            wget xz-utils make cmake perl ca-certificates python3 g++ libssl-dev flex bison zip

      # Arm GNU Toolchain with newlib. Ubuntu's gcc-arm-none-eabi package
      # uses picolibc, which is incompatible with the Xilinx BSP (references
      # newlib internals like _impure_ptr).
      - name: Cache Arm GNU Toolchain
        id: toolchain-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.ARM_TOOLCHAIN_DIR }}
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Download Arm GNU Toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          case "${{ runner.arch }}" in
            X64)   TC_HOST=x86_64  ;;
            ARM64) TC_HOST=aarch64 ;;
            *)     echo "Unsupported runner arch: ${{ runner.arch }}"; exit 1 ;;
          esac
          TC_BASE="arm-gnu-toolchain-${ARM_TOOLCHAIN_VERSION}-${TC_HOST}-arm-none-eabi"
          URL="https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VERSION}/binrel/${TC_BASE}.tar.xz"
          mkdir -p "${ARM_TOOLCHAIN_DIR}"
          wget -q "$URL" -O toolchain.tar.xz
          tar xf toolchain.tar.xz --strip-components=1 -C "${ARM_TOOLCHAIN_DIR}"
          rm toolchain.tar.xz

      - name: Add toolchain to PATH
        run: echo "${ARM_TOOLCHAIN_DIR}/bin" >> "$GITHUB_PATH"

      # bootgen is Xilinx's boot image packager. Not packaged by any distro,
      # so we build from source and cache the binary between runs.
      - name: Cache bootgen
        id: bootgen-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.toolchain/bootgen
          key: bootgen-${{ env.BOOTGEN_REF }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build bootgen from source
        if: steps.bootgen-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${BOOTGEN_REF}" https://github.com/Xilinx/bootgen.git bootgen-src
          make -C bootgen-src -j"$(nproc)"
          mkdir -p "${{ github.workspace }}/.toolchain/bootgen"
          if [ -x bootgen-src/bootgen ]; then
            cp bootgen-src/bootgen "${{ github.workspace }}/.toolchain/bootgen/bootgen"
          elif [ -x bootgen-src/build/bin/bootgen ]; then
            cp bootgen-src/build/bin/bootgen "${{ github.workspace }}/.toolchain/bootgen/bootgen"
          else
            find bootgen-src -maxdepth 4 -type f -name bootgen -print
            echo "bootgen executable not found after build" >&2
            exit 1
          fi

      - name: Export BOOTGEN
        run: echo "BOOTGEN=${{ github.workspace }}/.toolchain/bootgen/bootgen" >> "$GITHUB_ENV"

      # Codec deps (zlib/libpng/libjpeg-turbo/lzma) are downloaded + built from
      # source per run. Cache the built archives keyed on the build scripts
      # (which pin the versions + sha256s) so unchanged runs skip the rebuild
      # and survive an upstream mirror outage.
      - name: Cache codec deps
        uses: actions/cache@v5
        with:
          path: ZZ9000_proto.sdk/ZZ9000OS/build/deps
          key: codec-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build_zlib.sh', 'build_libpng.sh', 'build_libjpeg_turbo.sh', 'build_lzma_sdk.sh') }}

      - name: Build firmware (ZZ9000OS.elf)
        run: ./build_firmware.sh

      - name: Package release assets (standard)
        run: |
          set -euo pipefail
          BUILD_LABEL="${GITHUB_REF_NAME//\//-}"
          ARGS=(--tag "$BUILD_LABEL" --output release_assets)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ARGS+=(--require-all)
          fi
          ./build_release_assets.sh "${ARGS[@]}"

      # The former "ns-pal" firmware flavor (PAL Amiga ~49.92Hz videocap
      # default, issue #7) is no longer packaged: the same behavior comes
      # from `videocap_mode = pal` + `nonstandard_vsync = pal` in the
      # ZZ9000.CFG shipped inside every archive (issue #33). The
      # DEFAULT_NS_VIDEOCAP compile flag still works for manual builds.

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zz9000-firmware-${{ github.sha }}
          path: release_assets/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [build, host-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (for release notes generation)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: zz9000-firmware-${{ github.sha }}
          path: dist

      - name: Stage and rename release assets
        id: stage
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p release
          find dist -type f -name 'zz9000-firmware-*.zip' -exec cp {} release/ \;
          if ! find release -maxdepth 1 -type f | grep -q .; then
            echo "ERROR: no release assets staged." >&2
            exit 1
          fi
          # Pre-release if tag contains a hyphen (v1.14-rc1, v1.14-beta, …).
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          ls -lh release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          FLAGS=(--generate-notes --title "ZZ9000 firmware ${TAG}")
          if [[ "${{ steps.stage.outputs.prerelease }}" == "true" ]]; then
            FLAGS+=(--prerelease)
          fi
          mapfile -t ASSETS < <(find release -maxdepth 1 -type f | sort)
          gh release create "$TAG" "${FLAGS[@]}" "${ASSETS[@]}"
